<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面列表 - 内部网页服务</title>
  <style>
    /* ============ 骨架 CSS（结构性，不含颜色/装饰） ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif);
      background: var(--bg-body);
      min-height: 100vh;
      padding: var(--body-padding, 20px);
      color: var(--fg-text);
      transition: background 0.25s ease, color 0.25s ease;
    }
    .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

    .header {
      background: var(--bg-header);
      border-radius: var(--radius-header, 16px);
      padding: var(--header-padding, 32px);
      margin-bottom: var(--header-margin-bottom, 24px);
      border: var(--border-header, none);
      box-shadow: var(--shadow-header, 0 10px 40px rgba(0,0,0,0.2));
      position: relative;
    }
    .header h1 {
      color: var(--fg-text-strong);
      font-size: var(--h1-size, 28px);
      font-weight: var(--h1-weight, 700);
      margin-bottom: 8px;
      letter-spacing: var(--h1-letter-spacing, 0);
      display: flex; align-items: center; gap: 8px;
    }
    .header h1 > svg { color: var(--accent); flex-shrink: 0; }
    .header p { color: var(--fg-text-muted); font-size: 14px; }

    .page-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 7px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      border-radius: var(--badge-radius, 999px);
      color: var(--badge-fg);
      font-size: 12px; font-weight: 600; line-height: 1;
      font-family: var(--badge-font, inherit);
      letter-spacing: var(--badge-letter-spacing, 0);
      margin-left: 8px; vertical-align: 3px;
    }
    .refresh-btn {
      margin-left: 10px; vertical-align: 2px;
      width: 32px; height: 32px; padding: 0;
      background: var(--refresh-bg);
      border: 1px solid var(--refresh-border);
      border-radius: var(--refresh-radius, 8px);
      color: var(--refresh-fg); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .refresh-btn:hover { background: var(--refresh-bg-hover); border-color: var(--refresh-border-hover); color: var(--refresh-fg-hover); }

    .nav { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; align-items: center; }
    .nav a, .nav label, .nav button {
      padding: 10px 20px; background: var(--btn-nav-bg); color: var(--btn-nav-fg);
      text-decoration: none; border-radius: var(--btn-radius, 8px); font-size: 14px;
      transition: all 0.2s; cursor: pointer; display: inline-block;
      border: var(--btn-nav-border, none);
      letter-spacing: var(--btn-letter-spacing, 0);
      text-transform: var(--btn-text-transform, none);
      font-weight: var(--btn-weight, 500);
      font-family: var(--btn-font, inherit);
    }
    .nav a:hover, .nav label:hover, .nav button:hover {
      background: var(--btn-nav-bg-hover);
      border-color: var(--btn-nav-border-hover, var(--btn-nav-border, transparent));
      color: var(--btn-nav-fg-hover, var(--btn-nav-fg));
    }
    #file-input { display: none; }
    .upload-btn { background: var(--btn-primary-bg) !important; color: var(--btn-primary-fg) !important; }
    .upload-btn:hover { background: var(--btn-primary-bg-hover) !important; }
    .logout-btn { background: var(--btn-danger-bg) !important; color: var(--btn-danger-fg, var(--btn-nav-fg)) !important; margin-left: auto; border: var(--btn-danger-border, var(--btn-nav-border, none)) !important; }
    .logout-btn:hover {
      background: var(--btn-danger-bg-hover) !important;
      border-color: var(--btn-danger-border-hover, var(--btn-nav-border-hover, var(--btn-danger-border))) !important;
      color: var(--btn-danger-fg-hover, var(--btn-nav-fg-hover, var(--btn-danger-fg))) !important;
    }
    .user-info {
      padding: 10px 20px; background: var(--user-info-bg);
      border-radius: var(--btn-radius, 8px); font-size: 14px; color: var(--fg-text);
      display: flex; align-items: center; gap: 8px;
      border: var(--user-info-border, none);
    }
    .user-info img { width: 24px; height: 24px; border-radius: 50%; }

    .search-row {
      display: flex; gap: 10px; margin-top: 16px; position: relative;
      padding-top: var(--search-padding-top, 0);
      border-top: var(--search-border-top, none);
    }
    .search-row > svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: var(--search-icon-color);
    }
    .search-input {
      flex: 1; padding: 10px 36px 10px 40px;
      border: 2px solid var(--search-border);
      border-radius: var(--search-radius, 10px); font-size: 14px; outline: none;
      background: var(--search-bg); color: var(--fg-text);
      transition: border-color 0.2s;
      font-family: var(--search-font, inherit);
    }
    .search-input::placeholder { color: var(--search-placeholder); }
    .search-input:focus { border-color: var(--accent); }
    .search-clear-btn {
      position: absolute; right: 116px; top: 50%; transform: translateY(-50%);
      font-size: 16px; cursor: pointer; color: var(--search-icon-color);
      display: none; user-select: none; line-height: 1;
    }
    .search-btn {
      padding: 10px 24px; background: var(--btn-search-bg); color: var(--btn-search-fg);
      border: var(--btn-search-border, none);
      border-radius: var(--search-radius, 10px); font-size: 14px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
      letter-spacing: var(--btn-letter-spacing, 0);
      text-transform: var(--btn-text-transform, none);
      font-family: var(--btn-font, inherit);
      font-weight: var(--btn-weight, 500);
    }
    .search-btn:hover { opacity: 0.9; }

    .pages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--grid-gap, 24px); }

    .page-card {
      background: var(--bg-card);
      border-radius: var(--radius-card, 16px);
      padding: var(--card-padding, 24px);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative; overflow: hidden;
    }
    .page-card::before {
      content: var(--card-top-accent, '');
      position: absolute; top: 0; left: 0; right: 0;
      height: var(--card-top-accent-height, 4px);
      background: var(--card-top-accent-bg, transparent);
      transform: scaleX(var(--card-top-accent-scale, 0));
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: var(--card-top-accent-opacity, 1);
    }
    .page-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--border-card-hover);
      background: var(--bg-card-hover);
    }
    .page-card:hover::before { transform: scaleX(1); opacity: 1; }

    .card-index {
      font-size: 10px; letter-spacing: 3px; color: var(--card-index-color);
      font-family: var(--card-index-font, 'Consolas', monospace);
      margin-bottom: 6px; text-transform: uppercase;
      display: var(--card-index-display, none);
    }
    .title-tag {
      display: none;
      font-size: 10px; letter-spacing: 3px; color: var(--accent);
      text-transform: uppercase; font-family: 'Consolas', monospace;
      margin-bottom: 6px; font-weight: 700;
    }
    .corner {
      display: none;
      position: absolute; bottom: 6px; right: 6px;
      width: 14px; height: 14px; pointer-events: none;
      border-right: 1px solid var(--corner-color, #3a3a3a);
      border-bottom: 1px solid var(--corner-color, #3a3a3a);
    }
    .page-card h3 {
      color: var(--fg-text-strong); font-size: 18px; margin-bottom: 8px;
      word-break: break-all; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
      letter-spacing: var(--h3-letter-spacing, 0);
      font-family: var(--h3-font, inherit);
    }
    .rename-icon { cursor: pointer; font-size: 14px; opacity: 0.5; transition: opacity 0.2s, transform 0.2s; flex-shrink: 0; color: var(--icon-idle); }
    .rename-icon:hover { opacity: 1; transform: scale(1.2); color: var(--accent); }
    .rename-input {
      flex: 1; padding: 4px 8px; border: 2px solid var(--accent); border-radius: 6px;
      font-size: 18px; font-weight: 600; color: var(--fg-text-strong);
      outline: none; font-family: inherit;
      background: var(--search-bg);
    }
    .page-card p {
      color: var(--fg-text-muted); font-size: 13px; margin-bottom: 20px;
      font-family: 'Monaco', 'Consolas', monospace;
    }
    .actions { display: flex; gap: 10px; align-items: center; }
    .open-btn {
      flex: 1; display: inline-block; padding: 10px 20px;
      background: var(--btn-open-bg);
      color: var(--btn-open-fg); text-decoration: none;
      border-radius: var(--btn-radius, 10px); font-size: 14px; font-weight: 500;
      text-align: center; transition: all 0.3s ease;
      box-shadow: var(--btn-open-shadow);
      border: var(--btn-open-border, none);
      letter-spacing: var(--btn-letter-spacing, 0);
      text-transform: var(--btn-text-transform, none);
      font-family: var(--btn-font, inherit);
    }
    .open-btn:hover {
      background: var(--btn-open-bg-hover);
      box-shadow: var(--btn-open-shadow-hover);
      transform: translateY(-1px);
      color: var(--btn-open-fg-hover, var(--btn-open-fg));
      border-color: var(--btn-open-border-hover, var(--btn-open-border, transparent));
    }
    .actions .share-btn,
    .actions .download-btn,
    .actions .replace-btn,
    .actions .delete-btn {
      flex: 0 0 34px; width: 34px; height: 34px; padding: 0;
      border: 1px solid var(--btn-icon-border);
      border-radius: var(--btn-icon-radius, 8px);
      cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
      background: var(--btn-icon-bg);
      color: var(--btn-icon-fg);
    }
    /* 各功能按钮默认配色（可由主题覆盖） */
    .actions .share-btn {
      background: var(--btn-share-bg, var(--btn-icon-bg));
      color: var(--btn-share-fg, var(--btn-icon-fg));
      border-color: var(--btn-share-border, var(--btn-icon-border));
    }
    .actions .download-btn {
      background: var(--btn-download-bg, var(--btn-icon-bg));
      color: var(--btn-download-fg, var(--btn-icon-fg));
      border-color: var(--btn-download-border, var(--btn-icon-border));
    }
    .actions .replace-btn {
      background: var(--btn-replace-bg, var(--btn-icon-bg));
      color: var(--btn-replace-fg, var(--btn-icon-fg));
      border-color: var(--btn-replace-border, var(--btn-icon-border));
    }
    .actions .delete-btn {
      background: var(--btn-delete-bg, var(--btn-icon-bg));
      color: var(--btn-delete-fg, var(--btn-icon-fg));
      border-color: var(--btn-delete-border, var(--btn-icon-border));
    }
    .actions .share-btn:hover { background: var(--btn-share-bg-hover); border-color: var(--btn-share-border-hover); color: var(--btn-share-fg-hover); box-shadow: var(--btn-share-shadow-hover); transform: translateY(-1px); }
    .actions .download-btn:hover { background: var(--btn-download-bg-hover); border-color: var(--btn-download-border-hover); color: var(--btn-download-fg-hover); box-shadow: var(--btn-download-shadow-hover); transform: translateY(-1px); }
    .actions .replace-btn:hover { background: var(--btn-replace-bg-hover); border-color: var(--btn-replace-border-hover); color: var(--btn-replace-fg-hover); box-shadow: var(--btn-replace-shadow-hover); transform: translateY(-1px); }
    .actions .delete-btn:hover { background: var(--btn-delete-bg-hover); border-color: var(--btn-delete-border-hover); color: var(--btn-delete-fg-hover); box-shadow: var(--btn-delete-shadow-hover); transform: translateY(-1px); }

    .favorite-btn {
      position: absolute; top: 16px; right: 16px;
      background: none; border: none; cursor: pointer; padding: 4px;
      line-height: 1; transition: transform 0.2s;
    }
    .favorite-btn:hover { transform: scale(1.2); }
    .favorite-btn .star-active { fill: var(--star-active); stroke: var(--star-active); }
    .favorite-btn .star-idle { fill: none; stroke: var(--star-idle); }

    .empty-state {
      background: var(--bg-card); border-radius: var(--radius-card, 16px);
      padding: 60px 40px; text-align: center;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-card);
      grid-column: 1 / -1;
    }
    .empty-state .icon { font-size: 64px; margin-bottom: 16px; }
    .empty-state h2 { color: var(--fg-text-strong); font-size: 20px; margin-bottom: 8px; }
    .empty-state p { color: var(--fg-text-muted); font-size: 14px; }

    .toast {
      position: fixed; bottom: 20px; right: 20px;
      padding: 16px 24px; border-radius: 12px; color: white;
      font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      z-index: 1000; transform: translateY(100px); opacity: 0;
      transition: transform 0.3s, opacity 0.3s; font-weight: 500;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .toast.error { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }

    /* ============ 主题选择器 ============ */
    .theme-btn {
      padding: 10px 20px; background: var(--btn-nav-bg); color: var(--btn-nav-fg);
      border: var(--btn-nav-border, none);
      border-radius: var(--btn-radius, 8px); font-size: 14px; cursor: pointer;
      transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .theme-btn:hover { background: var(--btn-nav-bg-hover); }

    .theme-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5); z-index: 2000;
      align-items: center; justify-content: center;
    }
    .theme-modal.show { display: flex; }
    .theme-modal-inner {
      background: var(--bg-card); border-radius: 16px;
      padding: 28px; max-width: 720px; width: 92%;
      max-height: 84vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      position: relative; border: 1px solid var(--border-card);
    }
    .theme-modal-title { color: var(--fg-text-strong); font-size: 20px; margin-bottom: 20px; font-weight: 600; }
    .theme-modal-close {
      position: absolute; top: 14px; right: 14px;
      background: none; border: none; font-size: 20px; cursor: pointer;
      color: var(--fg-text-muted); line-height: 1; padding: 4px;
    }
    .theme-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
    }
    .theme-option {
      border: 2px solid var(--border-card); border-radius: 12px;
      padding: 14px; cursor: pointer; transition: all 0.2s;
      background: var(--bg-header);
    }
    .theme-option:hover { transform: translateY(-2px); border-color: var(--accent); }
    .theme-option.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .theme-swatch {
      height: 56px; border-radius: 8px; margin-bottom: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08); overflow: hidden;
      position: relative;
    }
    .theme-swatch::after {
      content: ''; position: absolute; bottom: 6px; left: 6px; right: 6px;
      height: 10px; border-radius: 3px;
      background: rgba(255, 255, 255, 0.85);
    }
    .theme-name {
      font-size: 13px; font-weight: 600; color: var(--fg-text-strong);
      text-align: center; letter-spacing: 0.5px;
    }
    .theme-name-en {
      font-size: 10px; color: var(--fg-text-muted);
      text-align: center; margin-top: 2px; letter-spacing: 1px;
      text-transform: uppercase; font-family: 'Consolas', monospace;
    }
    /* swatch 配色预览（不切换主题） */
    .swatch-classic   { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .swatch-light     { background: linear-gradient(135deg, #f6f7fb 0%, #e0e7ff 100%); }
    .swatch-dark      { background: linear-gradient(135deg, #1a1b2e 0%, #2d3252 100%); }
    .swatch-arknights { background: linear-gradient(135deg, #0a0a0a 0%, #ff6b35 100%); }
    .swatch-endfield  { background: linear-gradient(135deg, #edece6 0%, #7a8a6a 100%); }
    .swatch-genshin   { background: linear-gradient(135deg, #2b3a55 0%, #d4b678 100%); }
  </style>
  <link id="theme-css" rel="stylesheet" href="/themes/classic.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div>
          <div id="title-tag" class="title-tag"></div>
          <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>页面列表</span><span id="page-count" class="page-count" title="文件总数">0</span><button id="refresh-btn" class="refresh-btn" onclick="refreshPages()" title="刷新列表"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button></h1>
        </div>
        <div class="nav" style="margin: 0;">
          <span id="user-info" class="user-info" style="display:none;"></span>
          <button id="theme-btn" class="theme-btn" title="切换主题">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="8" r="1.2" fill="currentColor"/><circle cx="16.5" cy="10.5" r="1.2" fill="currentColor"/><circle cx="16.5" cy="14.5" r="1.2" fill="currentColor"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/><circle cx="7.5" cy="14.5" r="1.2" fill="currentColor"/><circle cx="7.5" cy="10.5" r="1.2" fill="currentColor"/></svg>
            主题
          </button>
          <a id="plugin-btn" href="https://github.com/seamusmore/hermes-webpage-share" target="_blank" style="display:none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>Agent接入</a>
          <button id="apikey-btn" style="display:none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><circle cx="8" cy="15" r="4"/><line x1="10.85" y1="12.15" x2="19" y2="4"/><line x1="18" y1="5" x2="20" y2="7"/><line x1="15" y1="8" x2="17" y2="10"/></svg>API Key</button>
          <button id="logout-btn" class="logout-btn" style="display:none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出登录</button>
          <label for="file-input" class="upload-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>上传 HTML</label>
          <input type="file" id="file-input" accept=".html,.htm">
        </div>
      </div>
      <div class="search-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="输入名称搜索..." onkeydown="if(event.key==='Enter')filterPages()" oninput="toggleClearBtn()">
        <span id="search-clear-btn" class="search-clear-btn" onclick="clearSearch()">✕</span>
        <button id="search-btn" class="search-btn" onclick="filterPages()">搜索</button>
      </div>
    </div>
    <div id="pages-container" class="pages-grid"></div>
  </div>
  <div id="toast" class="toast"></div>

  <!-- 主题选择器 -->
  <div id="theme-modal" class="theme-modal">
    <div class="theme-modal-inner">
      <button id="close-theme-modal" class="theme-modal-close">✕</button>
      <h2 class="theme-modal-title">🎨 选择主题</h2>
      <div class="theme-grid" id="theme-grid"></div>
    </div>
  </div>

  <!-- API Key 管理弹窗 -->
  <div id="apikey-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:white; border-radius:16px; padding:32px; max-width:480px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.3); position:relative;">
      <button id="close-apikey-modal" style="position:absolute; top:16px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:#64748b; line-height:1; padding:4px;">✕</button>
      <h2 style="color:#1f2937; font-size:20px; margin-bottom:24px; font-weight:600;">🔧 配置信息</h2>
      <div style="display:grid; gap:16px;">
        <div>
          <label style="display:block; color:#64748b; font-size:12px; margin-bottom:6px; font-weight:500;">租户 ID</label>
          <code id="modal-tenant-id" style="background:#f8fafc; padding:10px 12px; border-radius:8px; display:block; color:#0f172a; font-size:13px; word-break:break-all; border:1px solid #e2e8f0; font-family:monospace;">加载中...</code>
        </div>
        <div>
          <label style="display:block; color:#64748b; font-size:12px; margin-bottom:6px; font-weight:500;">API_KEY <button id="toggle-modal-apikey" style="background:none; border:none; cursor:pointer; font-size:14px; padding:0 4px;" title="显示/隐藏">👁️</button></label>
          <div style="display:flex; gap:8px; align-items:stretch;">
            <code id="modal-api-key" style="background:#f8fafc; padding:10px 12px; border-radius:8px; display:block; color:#0f172a; font-size:13px; word-break:break-all; border:1px solid #e2e8f0; flex:1; font-family:monospace;" data-is-masked="true">加载中...</code>
            <button id="copy-apikey-btn" style="background:#667eea; color:white; border:none; border-radius:8px; padding:10px 16px; font-size:14px; cursor:pointer; white-space:nowrap; transition:background 0.2s;"
              onmouseover="this.style.background='#5568d3'" onmouseout="this.style.background='#667eea'">📋 拷贝</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 重命名文件弹窗 -->
  <div id="rename-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:white; border-radius:16px; padding:32px; max-width:480px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.3); position:relative;">
      <button id="close-rename-modal" style="position:absolute; top:16px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:#64748b; line-height:1; padding:4px;">✕</button>
      <h2 style="color:#1f2937; font-size:20px; margin-bottom:24px; font-weight:600;">✏️ 重命名文件</h2>
      <div style="display:grid; gap:16px;">
        <div>
          <label style="display:block; color:#64748b; font-size:12px; margin-bottom:6px; font-weight:500;">原文件名</label>
          <code id="rename-original-filename" style="background:#f8fafc; padding:10px 12px; border-radius:8px; display:block; color:#0f172a; font-size:13px; word-break:break-all; border:1px solid #e2e8f0; font-family:monospace;"></code>
        </div>
        <div>
          <label style="display:block; color:#64748b; font-size:12px; margin-bottom:6px; font-weight:500;">新文件名</label>
          <input id="rename-new-filename" type="text" style="width:100%; padding:10px 12px; border:1px solid #e2e8f0; border-radius:8px; font-size:13px; outline:none; transition:border-color 0.2s;" onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e2e8f0'" placeholder="输入新的文件名（保留 .html 或 .htm 后缀）">
        </div>
      </div>
      <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:24px;">
        <button id="cancel-rename-btn" style="background:#f3f4f6; color:#374151; border:none; border-radius:8px; padding:10px 20px; font-size:14px; cursor:pointer; transition:background 0.2s;" onmouseover="this.style.background='#e5e7eb'" onmouseout="this.style.background='#f3f4f6'">取消</button>
        <button id="confirm-rename-btn" style="background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; border:none; border-radius:8px; padding:10px 20px; font-size:14px; cursor:pointer; transition:opacity 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">确认重命名</button>
      </div>
    </div>
  </div>

  <script>
    let isLoggedIn = false;
    let currentUser = null;
    let currentApiKey = null;
    let allPagesData = [];
    let currentTheme = 'classic';

    // ============ 主题管理 ============
    const THEMES = [
      { id: 'classic',   name: '原版',     en: 'Classic',   desc: '紫蓝渐变' },
      { id: 'light',     name: '浅色',     en: 'Light',     desc: '清爽工具风' },
      { id: 'dark',      name: '深色',     en: 'Dark',      desc: '仪表盘感' },
      { id: 'arknights', name: '方舟',     en: 'Arknights', desc: '黑橙工业' },
      { id: 'endfield',  name: '终末地',   en: 'Endfield',  desc: '米白档案' },
      { id: 'genshin',   name: '原神',     en: 'Genshin',   desc: '金紫华丽' }
    ];

    // 各主题文案（照搬小样原稿）
    const THEME_TEXT = {
      classic:   { tag: '', ph: '输入名称搜索...',       search: '搜索',     open: '🚀 打开页面', fileP: '📄 ', timeP: '🕐 ', timeFmt: 'default' },
      light:     { tag: '', ph: '输入名称搜索...',       search: '搜索',     open: '🚀 打开页面', fileP: '📄 ', timeP: '🕐 ', timeFmt: 'default' },
      dark:      { tag: '', ph: '输入名称搜索...',       search: '搜索',     open: '🚀 打开页面', fileP: '📄 ', timeP: '🕐 ', timeFmt: 'default' },
      arknights: { tag: '// ARCHIVE_TERMINAL', ph: '> query: name_keyword', search: 'EXEC', open: 'OPEN', fileP: '> ', timeP: '> ', timeFmt: 'zh-hyphen' },
      endfield:  { tag: 'TALOS-II DATA ARCHIVE', ph: 'search_by_name', search: 'SEARCH', open: 'OPEN', fileP: 'fname: ', timeP: 'mtime: ', timeFmt: 'zh-hyphen', countPad: 3 },
      genshin:   { tag: '✦ Teyvat Archive ✦', ph: '请输入页面前缀……', search: '搜索', open: '打开页面', fileP: '', timeP: '', timeFmt: 'zh-dot' }
    };

    function themeText(key) {
      return (THEME_TEXT[currentTheme] || THEME_TEXT.classic)[key] ?? '';
    }

    function formatCount(n) {
      return String(n).padStart(themeText('countPad') || 0, '0');
    }

    function formatDate(d, fmt) {
      const dt = new Date(d);
      const hh = String(dt.getHours()).padStart(2, '0');
      const mm = String(dt.getMinutes()).padStart(2, '0');
      if (fmt === 'zh-dot') {
        return dt.getFullYear() + '年' + (dt.getMonth() + 1) + '月' + dt.getDate() + '日 · ' + hh + ':' + mm;
      }
      if (fmt === 'zh-hyphen') {
        const mo = String(dt.getMonth() + 1).padStart(2, '0');
        const dd = String(dt.getDate()).padStart(2, '0');
        return dt.getFullYear() + '-' + mo + '-' + dd + ' ' + hh + ':' + mm;
      }
      return dt.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function renderUserInfo() {
      const userInfo = document.getElementById('user-info');
      if (!userInfo || !currentUser) return;
      if (currentTheme === 'classic') {
        userInfo.style.display = 'inline-block';
        userInfo.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 6px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' + currentUser.name;
        userInfo.classList.remove('avatar-mode');
      } else {
        userInfo.style.display = 'inline-flex';
        userInfo.innerHTML = (currentUser.name || '?').slice(-1);
        userInfo.classList.add('avatar-mode');
      }
    }

    function applyTheme(themeId) {
      if (!THEMES.find(t => t.id === themeId)) themeId = 'classic';
      currentTheme = themeId;
      document.documentElement.setAttribute('data-theme', themeId);
      const link = document.getElementById('theme-css');
      if (link) link.href = '/themes/' + themeId + '.css';
      // 更新 header 文案
      const si = document.getElementById('search-input');
      if (si) si.placeholder = themeText('ph');
      const sb = document.getElementById('search-btn');
      if (sb) sb.textContent = themeText('search');
      const tt = document.getElementById('title-tag');
      if (tt) tt.textContent = themeText('tag');
      // 更新头像/用户名
      renderUserInfo();
      // 数字徽章按当前主题重新格式化（补0位数各主题不同）
      const pc = document.getElementById('page-count');
      if (pc) pc.textContent = formatCount(allPagesData ? allPagesData.length : 0);
      // 高亮选中项
      document.querySelectorAll('.theme-option').forEach(el => {
        el.classList.toggle('active', el.dataset.theme === themeId);
      });
      // 重新渲染卡片（应用新文案）
      if (allPagesData && allPagesData.length) {
        filterPages();
      }
    }

    async function loadThemePreference() {
      try {
        const res = await fetch('/api/theme', { headers: { 'X-API-Key': currentApiKey || '' } });
        const data = await res.json();
        if (data && data.theme) applyTheme(data.theme);
        else applyTheme('classic');
      } catch (err) {
        console.warn('加载主题偏好失败，回退默认', err);
        applyTheme('classic');
      }
    }

    async function saveThemePreference(themeId) {
      try {
        await fetch('/api/theme', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-API-Key': currentApiKey || '' },
          body: JSON.stringify({ theme: themeId })
        });
      } catch (err) {
        console.warn('保存主题失败', err);
        showToast('⚠️ 主题未保存（网络异常）', 'error');
      }
    }

    function renderThemeGrid() {
      const grid = document.getElementById('theme-grid');
      if (!grid) return;
      grid.innerHTML = THEMES.map(t =>
        '<div class="theme-option" data-theme="' + t.id + '" onclick="selectTheme(\'' + t.id + '\')">'
        + '<div class="theme-swatch swatch-' + t.id + '"></div>'
        + '<div class="theme-name">' + t.name + '</div>'
        + '<div class="theme-name-en">' + t.en + ' · ' + t.desc + '</div>'
        + '</div>'
      ).join('');
    }

    async function selectTheme(themeId) {
      applyTheme(themeId);
      await saveThemePreference(themeId);
      showToast('🎨 已切换到「' + (THEMES.find(t => t.id === themeId)?.name || themeId) + '」');
    }

    // 主题弹窗事件
    document.addEventListener('DOMContentLoaded', () => {
      renderThemeGrid();
      document.getElementById('theme-btn')?.addEventListener('click', () => {
        document.getElementById('theme-modal').classList.add('show');
      });
      document.getElementById('close-theme-modal')?.addEventListener('click', () => {
        document.getElementById('theme-modal').classList.remove('show');
      });
      document.getElementById('theme-modal')?.addEventListener('click', (e) => {
        if (e.target.id === 'theme-modal') {
          document.getElementById('theme-modal').classList.remove('show');
        }
      });
    });
    
    // 强制登录检查 - 未登录重定向到首页（带原页面地址）
    async function forceAuth() {
      try {
        const res = await fetch('/api/check');
        const data = await res.json();
        if (!data.authenticated) {
          // 未登录，重定向到首页，带上原页面地址
          const currentPath = window.location.pathname;
          window.location.href = '/?redirect=' + encodeURIComponent(currentPath);
          return false;
        }
        return true;
      } catch (err) {
        const currentPath = window.location.pathname;
        window.location.href = '/?redirect=' + encodeURIComponent(currentPath);
        return false;
      }
    }
    
    // 检查登录状态
    async function checkLogin() {
      try {
        const res = await fetch('/api/check');
        const data = await res.json();
        if (data.authenticated) {
          isLoggedIn = true;
          currentUser = data.user;
          showLoggedInUI(currentUser);
        } else {
          isLoggedIn = false;
          showLoggedOutUI();
        }
      } catch (err) {
        console.error('检查登录状态失败:', err);
        showLoggedOutUI();
      }
    }
    
    async function showLoggedInUI(user) {
      const userInfo = document.getElementById('user-info');
      userInfo.style.display = 'inline-block';
      renderUserInfo();
      document.getElementById('file-input').disabled = false;
      document.getElementById('apikey-btn').style.display = 'inline-block';
      document.getElementById('plugin-btn').style.display = 'inline-block';
      document.getElementById('logout-btn').style.display = 'inline-block';
      
      // 加载配置信息（等待 API_KEY 加载完成）
      await loadConfigInfo(user);

      // 加载主题偏好（在 loadPages 之前，确保主题先就位）
      await loadThemePreference();

      // 加载页面列表
      loadPages();
    }
    
    function showLoggedOutUI() {
      document.getElementById('user-info').style.display = 'none';
      document.getElementById('file-input').disabled = true;
      document.getElementById('apikey-btn').style.display = 'none';
      document.getElementById('plugin-btn').style.display = 'none';
      document.getElementById('logout-btn').style.display = 'none';
    }
    
    // 退出登录

    // API Key 弹窗
    document.getElementById('apikey-btn')?.addEventListener('click', () => {
      document.getElementById('apikey-modal').style.display = 'flex';
    });
    document.getElementById('close-apikey-modal')?.addEventListener('click', () => {
      document.getElementById('apikey-modal').style.display = 'none';
    });
    document.getElementById('apikey-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'apikey-modal') {
        document.getElementById('apikey-modal').style.display = 'none';
      }
    });

    // 拷贝 API_KEY
    document.getElementById('copy-apikey-btn')?.addEventListener('click', async () => {
      const apiKeyEl = document.getElementById('modal-api-key');
      const apiKey = apiKeyEl.dataset.isMasked === 'true' ? apiKeyEl.dataset.fullKey : apiKeyEl.textContent;
      if (!apiKey || apiKey === '加载中...' || apiKey === '加载失败') {
        showToast('暂无可拷贝的 API_KEY', 'error');
        return;
      }
      try {
        await navigator.clipboard.writeText(apiKey);
        showToast('✅ API_KEY 已拷贝到剪贴板', 'success');
      } catch (err) {
        const textarea = document.createElement('textarea');
        textarea.value = apiKey;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('✅ API_KEY 已拷贝到剪贴板', 'success');
        } catch (fallbackErr) {
          showToast('❌ 拷贝失败，请手动复制', 'error');
        }
        document.body.removeChild(textarea);
      }
    });

    // 切换 API_KEY 显示/隐藏
    document.getElementById('toggle-modal-apikey')?.addEventListener('click', function() {
      const apiKeyEl = document.getElementById('modal-api-key');
      if (apiKeyEl.dataset.isMasked === 'true') {
        apiKeyEl.textContent = apiKeyEl.dataset.fullKey;
        this.textContent = '🙈';
        apiKeyEl.dataset.isMasked = 'false';
      } else {
        apiKeyEl.textContent = apiKeyEl.dataset.maskedKey;
        this.textContent = '👁️';
        apiKeyEl.dataset.isMasked = 'true';
      }
    });

    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      try {
        await fetch('/api/logout', { method: 'POST' });
        showToast('已退出登录', 'success');
        setTimeout(() => {
          window.location.href = '/';
        }, 500);
      } catch (err) {
        showToast('退出登录失败', 'error');
      }
    });
    
    // 获取登录 URL（带当前页面地址）
    async function getLoginUrl() {
      try {
        // 保存当前页面路径，登录后跳回这里
        const currentPage = window.location.pathname;
        localStorage.setItem('login_redirect_url', currentPage);
        
        // 传递给后端 redirect 参数
        const res = await fetch('/api/login-url?redirect=' + encodeURIComponent(currentPage));
        const data = await res.json();
        return data.url;
      } catch (err) {
        console.error('获取登录 URL 失败:', err);
        return null;
      }
    }
    
    // 页面加载时自动检查
    document.addEventListener('DOMContentLoaded', async () => {
      // 强制认证检查
      const authenticated = await forceAuth();
      if (!authenticated) return;
      
      await checkLogin();
      
      // 绑定登录按钮（如果需要手动触发登录）
      const loginBtn = document.getElementById('login-btn');
      if (loginBtn) {
        loginBtn.addEventListener('click', async () => {
          const loginUrl = await getLoginUrl();
          if (loginUrl) {
            window.location.href = loginUrl;
          }
        });
      }
    });
    
    // 加载配置信息
    async function loadConfigInfo(user) {
      try {
        const res = await fetch('/api/check');
        const data = await res.json();
        const tenantId = user.tenant_id || user.open_id;
        const apiKey = data.api_key || '暂无';
        
        // 保存 API_KEY 到全局变量
        currentApiKey = apiKey;
        
        // 填充弹窗
        document.getElementById('modal-tenant-id').textContent = tenantId;
        
        // 脱敏显示 API_KEY
        const maskedKey = apiKey && apiKey.length > 20 ? apiKey.substring(0, 10) + '...' + apiKey.substring(apiKey.length - 10) : apiKey;
        const apiKeyEl = document.getElementById('modal-api-key');
        apiKeyEl.textContent = maskedKey;
        apiKeyEl.dataset.fullKey = apiKey;
        apiKeyEl.dataset.maskedKey = maskedKey;
        apiKeyEl.dataset.isMasked = 'true';
        
        return true;
      } catch (err) {
        console.error('加载配置失败:', err);
        document.getElementById('modal-api-key').textContent = '加载失败';
        return false;
      }
    }
    
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show ' + type;
      setTimeout(() => toast.className = 'toast', 3000);
    }
    
    async function refreshPages() {
      await loadPages();
      // loadPages 会重置渲染，若搜索框有关键词则重新过滤
      const keyword = (document.getElementById('search-input')?.value || '').trim();
      if (keyword) filterPages();
      showToast('🔄 列表已刷新');
    }

    async function loadPages() {
      try {
        const res = await fetch('/api/list', {
          headers: {
            'X-API-Key': currentApiKey || ''
          }
        });
        const data = await res.json();
        const container = document.getElementById('pages-container');
        const countEl = document.getElementById('page-count');
        if (!data.success || data.pages.length === 0) {
          allPagesData = [];
          if (countEl) countEl.textContent = formatCount(0);
          container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h2>还没有页面</h2><p>上传 HTML 文件后这里会显示列表</p></div>';
          return;
        }
        allPagesData = data.pages;
        if (countEl) countEl.textContent = formatCount(data.pages.length);
        renderPages(data.pages);
      } catch (err) {
        document.getElementById('pages-container').innerHTML = '<div class="empty-state"><div class="icon">❌</div><h2>加载失败</h2><p>' + err.message + '</p></div>';
      }
    }
    
    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.name.endsWith('.html') && !file.name.endsWith('.htm')) {
        showToast('❌ 请上传 HTML 文件', 'error');
        return;
      }
      const formData = new FormData();
      formData.append('file', file);
      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: {
            'X-API-Key': currentApiKey || ''
          },
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          showToast('✅ 上传成功：' + file.name);
          loadPages();
        } else {
          showToast('❌ 上传失败：' + data.error, 'error');
        }
      } catch (err) {
        showToast('❌ 上传失败：' + err.message, 'error');
      }
      e.target.value = '';
    });
    
    async function sharePage(filename, shareUrl) {
      try {
        // 复制到剪贴板
        await navigator.clipboard.writeText(shareUrl);
        showToast('🔗 分享链接已复制！', 'success');
      } catch (err) {
        // 降级方案：选中 textarea 内容
        const textArea = document.createElement('textarea');
        textArea.value = shareUrl;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('🔗 分享链接已复制！', 'success');
        } catch (fallbackErr) {
          showToast('❌ 复制失败，请手动复制链接', 'error');
        }
        document.body.removeChild(textArea);
      }
    }

    function renderPages(pages) {
      const container = document.getElementById('pages-container');
      container.innerHTML = '';
      if (pages.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h2>没有匹配的页面</h2><p>试试其他关键词</p></div>';
        return;
      }
      pages.sort((a, b) => {
        if (a.is_favorite !== b.is_favorite) return a.is_favorite ? -1 : 1;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });
      pages.forEach((page, i) => {
        const filename = page.filename;
        let displayName = page.display_name || filename.replace(/\.(html|htm)$/i, '');
        displayName = displayName.replace(/^\d+-upload-/, '');
        displayName = displayName.replace(/^\d+-/, '');
        displayName = displayName.replace(/-/g, ' ').replace(/_/g, ' ');

        const isFav = page.is_favorite;
        const starCls = isFav ? 'star-active' : 'star-idle';
        const starSvg = '<svg class="' + starCls + '" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

        // 主题文案
        const filePrefix = themeText('fileP');
        const timePrefix = themeText('timeP');
        const openText = themeText('open');
        const idx = String(i + 1).padStart(3, '0');
        let cardIdx = '';
        if (currentTheme === 'arknights') cardIdx = '// DOC_' + idx;
        else if (currentTheme === 'endfield') cardIdx = 'DOC_' + idx + ' · REPORT';
        else if (currentTheme === 'genshin') cardIdx = 'Doc.' + idx + ' · Simulation Report';

        const card = document.createElement('div');
        card.className = 'page-card';
        const tenantId = currentUser?.tenant_id || currentUser?.open_id || 'default';
        const shareUrl = window.location.origin + '/' + tenantId + '/pages/' + encodeURIComponent(filename);
        const createdDate = page.createdAt ? formatDate(page.createdAt, themeText('timeFmt')) : '';
        card.innerHTML = '<button class="favorite-btn" onclick="toggleFavorite(\'' + filename + '\', this)" title="收藏">' + starSvg + '</button>'
          + '<div class="card-index">' + cardIdx + '</div>'
          + '<h3 data-display-name="' + displayName + '">' + displayName + ' <span class="rename-icon" onclick="renamePage(\'' + filename + '\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span></h3>'
          + '<p style="font-size: 11px; color: var(--meta-filename); margin-top: 2px; margin-bottom: 0;">' + filePrefix + filename + '</p>'
          + (createdDate ? '<p style="font-size: 11px; color: var(--meta-time); margin-top: 1px; margin-bottom: 12px;">' + timePrefix + createdDate + '</p>' : '<p style="margin-bottom: 12px;"></p>')
          + '<div class="actions"><a class="open-btn" href="/' + tenantId + '/pages/' + encodeURIComponent(filename) + '" target="_blank">' + openText + '</a>'
          + '<button class="share-btn" onclick="sharePage(\'' + filename + '\', \'' + shareUrl + '\')" title="分享"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>'
          + '<button class="download-btn" onclick="downloadPage(\'' + filename + '\')" title="下载"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>'
          + '<button class="replace-btn" onclick="replacePage(\'' + filename + '\')" title="更新文件"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>'
          + '<button class="delete-btn" onclick="deletePage(\'' + filename + '\')" title="删除"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>'
          + '<div class="corner"></div>';
        container.appendChild(card);
      });
    }

    function filterPages() {
      const keyword = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
      toggleClearBtn();
      if (!keyword) {
        renderPages(allPagesData);
        return;
      }
      const filtered = allPagesData.filter(page => {
        const filename = (page.filename || '').toLowerCase();
        const displayName = (page.display_name || page.filename || '').toLowerCase();
        return filename.includes(keyword) || displayName.includes(keyword);
      });
      renderPages(filtered);
    }

    async function toggleFavorite(filename, btn) {
      try {
        const res = await fetch('/api/favorites', {
          method: 'POST',
          headers: { 'X-API-Key': currentApiKey || '', 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename })
        });
        const data = await res.json();
        if (data.success) {
          // 更新本地数据
          const page = allPagesData.find(p => p.filename === filename);
          if (page) page.is_favorite = data.is_favorite;
          // 重新渲染当前列表（保持搜索状态）
          const keyword = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
          let pages = allPagesData;
          if (keyword) {
            pages = allPagesData.filter(p => {
              const fn = (p.filename || '').toLowerCase();
              const dn = (p.display_name || p.filename || '').toLowerCase();
              return fn.includes(keyword) || dn.includes(keyword);
            });
          }
          // 收藏置顶排序
          pages.sort((a, b) => {
            if (a.is_favorite !== b.is_favorite) return a.is_favorite ? -1 : 1;
            return new Date(b.createdAt) - new Date(a.createdAt);
          });
          renderPages(pages);
        } else {
          showToast('❌ 操作失败', 'error');
        }
      } catch (err) {
        showToast('❌ 收藏失败: ' + err.message, 'error');
      }
    }

    function toggleClearBtn() {
      const input = document.getElementById('search-input');
      const clearBtn = document.getElementById('search-clear-btn');
      if (!input || !clearBtn) return;
      clearBtn.style.display = input.value ? 'block' : 'none';
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      toggleClearBtn();
      renderPages(allPagesData);
    }

    async function replacePage(filename) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.html,.htm';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        try {
          const formData = new FormData();
          formData.append('file', file);
          showToast('⏳ 正在更新...', 'success');
          const res = await fetch('/api/replace?filename=' + encodeURIComponent(filename), {
            method: 'POST',
            headers: { 'X-API-Key': currentApiKey || '' },
            body: formData
          });
          const data = await res.json();
          if (data.success) {
            showToast('✅ 文件已更新', 'success');
            loadPages();
          } else {
            showToast('❌ 更新失败: ' + (data.error || '未知错误'), 'error');
          }
        } catch (err) {
          showToast('❌ 更新失败: ' + err.message, 'error');
        }
      };
      input.click();
    }

    async function downloadPage(filename) {
      try {
        const res = await fetch('/api/download?filename=' + encodeURIComponent(filename), {
          headers: {
            'X-API-Key': currentApiKey || ''
          }
        });
        
        if (!res.ok) {
          const data = await res.json().catch(() => ({ error: '下载失败' }));
          throw new Error(data.error || '下载失败');
        }
        
        // 获取文件名并触发下载
        const contentDisposition = res.headers.get('Content-Disposition');
        let downloadName = filename;
        if (contentDisposition) {
          const match = contentDisposition.match(/filename="?([^"]+)"?/);
          if (match) {
            downloadName = decodeURIComponent(match[1]);
          }
        }
        
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = downloadName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showToast('⬇️ 开始下载：' + downloadName);
      } catch (err) {
        showToast('❌ 下载失败：' + err.message, 'error');
      }
    }

    // 重命名文件功能
    let currentRenameFilename = null;

    function openRenameModal(filename) {
      currentRenameFilename = filename;
      document.getElementById('rename-original-filename').textContent = filename;
      document.getElementById('rename-new-filename').value = '';
      document.getElementById('rename-modal').style.display = 'flex';
      document.getElementById('rename-new-filename').focus();
    }

    function closeRenameModal() {
      document.getElementById('rename-modal').style.display = 'none';
      currentRenameFilename = null;
    }

    // 绑定重命名弹窗事件
    document.getElementById('close-rename-modal')?.addEventListener('click', closeRenameModal);
    document.getElementById('cancel-rename-btn')?.addEventListener('click', closeRenameModal);
    document.getElementById('rename-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'rename-modal') closeRenameModal();
    });

    document.getElementById('confirm-rename-btn')?.addEventListener('click', async () => {
      if (!currentRenameFilename) return;
      const newName = document.getElementById('rename-new-filename').value.trim();
      if (!newName) {
        showToast('❌ 请输入新文件名', 'error');
        return;
      }
      if (!newName.match(/^[a-zA-Z0-9_\u4e00-\u9fa5\s-]+\.(html|htm)$/i)) {
        showToast('❌ 文件名必须以 .html 或 .htm 结尾', 'error');
        return;
      }

      try {
        const res = await fetch('/api/rename', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': currentApiKey || ''
          },
          body: JSON.stringify({ old_filename: currentRenameFilename, new_filename: newName })
        });
        const data = await res.json();
        if (data.success) {
          showToast('✅ 重命名成功：' + newName);
          closeRenameModal();
          loadPages();
        } else {
          showToast('❌ 重命名失败：' + data.error, 'error');
        }
      } catch (err) {
        showToast('❌ 重命名失败：' + err.message, 'error');
      }
    });

    async function renamePage(filename) {
      const card = event.target.closest('.page-card');
      const h3 = card.querySelector('h3');
      const currentName = h3.dataset.displayName || h3.textContent.replace('✏️', '').trim();
      
      // 替换为输入框
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'rename-input';
      input.value = currentName;
      input.dataset.filename = filename;
      
      // 替换标题内容
      h3.innerHTML = '';
      h3.appendChild(input);
      input.focus();
      input.select();
      
      // 保存函数
      const saveRename = async () => {
        const newName = input.value.trim();
        if (!newName || newName === currentName) {
          // 恢复原标题
          loadPages();
          return;
        }
        
        try {
          const oldExt = filename.match(/\.(html|htm)$/i)?.[0] || '.html';
        const newFilename = newName.replace(/\.(html|htm)$/i, '') + oldExt;
        const res = await fetch('/api/rename', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-API-Key': currentApiKey || ''
            },
            body: JSON.stringify({ old_filename: filename, new_filename: newFilename })
          });
          const data = await res.json();
          if (data.success) {
            showToast('✅ 文件已重命名：' + newFilename);
            loadPages();
          } else {
            showToast('❌ 重命名失败：' + data.error, 'error');
            loadPages();
          }
        } catch (err) {
          showToast('❌ 更新失败：' + err.message, 'error');
          loadPages();
        }
      };
      
      // 失焦保存（延迟避免点击按钮时触发）
      input.addEventListener('blur', () => setTimeout(saveRename, 100));
      // 回车保存
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          input.blur();
        }
      });
    }
    
    async function deletePage(filename) {
      if (!confirm('确定要删除 "' + filename + '" 吗？此操作不可恢复！')) {
        return;
      }
      try {
        const res = await fetch('/api/delete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': currentApiKey || ''
          },
          body: JSON.stringify({ filename: filename })
        });
        const data = await res.json();
        if (data.success) {
          showToast('✅ 删除成功：' + filename);
          loadPages();
        } else {
          showToast('❌ 删除失败：' + data.error, 'error');
        }
      } catch (err) {
        showToast('❌ 删除失败：' + err.message, 'error');
      }
    }
  </script>
